<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIメシモリ</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="phone">
  <header>
    <div class="brand">🍽️ AIメシモリ <span class="mock-badge">ローカル版</span></div>
    <div class="nav"><button id="prev" aria-label="前の月">‹</button><span id="ym"></span><button id="next" aria-label="次の月">›</button></div>
  </header>
  <nav class="tabs">
    <button data-tab="cal" class="on">📅 カレンダー</button>
    <button data-tab="weight">⚖️ 体重</button>
  </nav>
  <main>
    <section id="view-cal">
      <div id="cal"></div>
      <div class="legend"><span class="dot a"></span>actual <span class="dot p"></span>planned <span class="dot s"></span>skipped　／　合計は actual の中央値のみ</div>
      <section id="detail"><p class="hint">日をタップすると、その日の食事が出るよ</p></section>
    </section>
    <section id="view-weight" hidden>
      <h2>⚖️ 体重推移 <small>（標準時 std_date で引く）</small></h2>
      <div id="wchart"></div>
      <div id="wlist"></div>
      <p class="hint">体重は標準時（std_date）で表示します。</p>
    </section>
  </main>
  <footer>AIメシモリ ・ データは 2026年10月の実記録から seed</footer>
</div>
<script src="/app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{})</script>
</body></html>
